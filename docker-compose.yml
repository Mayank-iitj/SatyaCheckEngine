version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: proofmind-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: proofmind
      POSTGRES_PASSWORD: proofmind
      POSTGRES_DB: proofmind
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
